<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand-Risk Intelligence &amp; RAG Agent</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
      --high: #ef4444; --med: #f59e0b; --low: #10b981;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 2rem 1rem; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 0.25rem; }
    .docs-link { color: var(--accent); text-decoration: none; border: 1px solid var(--border); padding: 0.45rem 0.9rem; border-radius: 6px; font-size: 0.85rem; }
    .presets { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    button.preset { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 0.5rem 0.85rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    button.preset:hover { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0.75rem 0 0.25rem; text-transform: uppercase; letter-spacing: 0.04em; }
    input, textarea { width: 100%; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem; font-size: 0.9rem; }
    textarea { resize: vertical; min-height: 70px; }
    button.primary { width: 100%; margin-top: 1rem; background: var(--accent); color: #0f172a; font-weight: 700; border: none; padding: 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    button.primary:disabled { opacity: 0.6; cursor: wait; }
    .badge { display: inline-block; padding: 0.25rem 0.65rem; border-radius: 999px; font-weight: 700; font-size: 0.8rem; }
    .HIGH { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid var(--high); }
    .MEDIUM { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid var(--med); }
    .LOW { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid var(--low); }
    .meta { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin: 0.75rem 0; }
    .policy-item { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 0.65rem; margin-top: 0.5rem; font-size: 0.85rem; }
    pre { background: #0f172a; padding: 0.75rem; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Brand-Risk Intelligence &amp; RAG Agent</h1>
        <div class="subtitle">FastAPI + LangGraph + PostgreSQL (pgvector) + Pydantic Trust &amp; Safety Triage</div>
      </div>
      <a class="docs-link" href="/docs" target="_blank">Swagger API (/docs) &rarr;</a>
    </header>

    <div class="presets">
      <button class="preset" onclick="loadPreset('scam')">Preset 1: Crypto VIP Scam (HIGH)</button>
      <button class="preset" onclick="loadPreset('support')">Preset 2: Fake Helpdesk Phishing (HIGH)</button>
      <button class="preset" onclick="loadPreset('official')">Preset 3: Official Brand Account (LOW)</button>
    </div>

    <div class="grid">
      <div class="card">
        <strong>1. Incoming Social Profile</strong>
        <label>Target Brand</label>
        <input id="brand" value="ApexBank" />
        <label>Account Handle</label>
        <input id="handle" value="@apexbank_vip_trades" />
        <label>Display Name</label>
        <input id="display_name" value="ApexBank Wealth Advisory" />
        <label>External URL</label>
        <input id="external_url" value="https://t.me/apexbank_vip_signals" />
        <label>Profile Bio</label>
        <textarea id="bio">Official ApexBank VIP Wealth Desk. Guaranteed 18% weekly crypto arbitrage returns. DM or join Telegram to deposit.</textarea>
        <label>Recent Posts (one per line)</label>
        <textarea id="posts">Limited slots left for ApexBank VIP yield pool! Send USDT now.
Guaranteed principal protection for ApexBank members.</textarea>
        <button class="primary" id="runBtn" onclick="runTriage()">Run RAG Triage Agent</button>
      </div>

      <div class="card">
        <strong>2. Grounded Policy Verdict</strong>
        <div id="output" style="margin-top: 0.75rem; color: var(--muted);">
          Click a preset or edit the profile on the left, then click <strong>Run RAG Triage Agent</strong>.
        </div>
      </div>
    </div>
  </div>

  <script>
    const PRESETS = {
      scam: {
        brand: "ApexBank",
        handle: "@apexbank_vip_trades",
        display_name: "ApexBank Wealth Advisory",
        external_url: "https://t.me/apexbank_vip_signals",
        bio: "Official ApexBank VIP Wealth Desk. Guaranteed 18% weekly crypto arbitrage returns. DM or join Telegram to deposit.",
        posts: "Limited slots left for ApexBank VIP yield pool! Send USDT now.\nGuaranteed principal protection for ApexBank members."
      },
      support: {
        brand: "ApexBank",
        handle: "@apexbank_helpdesk_tw",
        display_name: "ApexBank Support Team",
        external_url: "https://apexbank-verify-login.example.com",
        bio: "24/7 ApexBank Customer Care. Account locked? Verify your seed phrase and OTP via our official portal.",
        posts: "Urgent security alert: click the link in bio to prevent ApexBank account suspension."
      },
      official: {
        brand: "ApexBank",
        handle: "@apexbank_official",
        display_name: "ApexBank Official",
        external_url: "https://www.apexbank.com",
        bio: "Official global account for ApexBank. Regulated digital banking & treasury services. We never DM first.",
        posts: "Read our Q3 transparency report at apexbank.com/news."
      }
    };

    function loadPreset(key) {
      const p = PRESETS[key];
      document.getElementById("brand").value = p.brand;
      document.getElementById("handle").value = p.handle;
      document.getElementById("display_name").value = p.display_name;
      document.getElementById("external_url").value = p.external_url;
      document.getElementById("bio").value = p.bio;
      document.getElementById("posts").value = p.posts;
    }

    async function runTriage() {
      const btn = document.getElementById("runBtn");
      const out = document.getElementById("output");
      btn.disabled = true;
      btn.textContent = "Retrieving pgvector policies & reasoning...";

      const extUrl = document.getElementById("external_url").value.trim();
      const payload = {
        brand: document.getElementById("brand").value.trim(),
        handle: document.getElementById("handle").value.trim(),
        display_name: document.getElementById("display_name").value.trim() || document.getElementById("handle").value.trim(),
        external_url: extUrl || null,
        bio: document.getElementById("bio").value.trim(),
        recent_posts: document.getElementById("posts").value.split("\n").map(s => s.trim()).filter(Boolean)
      };

      const start = performance.now();
      try {
        const res = await fetch("/api/v1/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        const elapsed = Math.round(performance.now() - start);

        if (!res.ok) {
          out.innerHTML = `<span class="badge HIGH">ERROR ${res.status}</span><pre>${JSON.stringify(data, null, 2)}</pre>`;
          return;
        }

        const risk = data.risk_level || "UNKNOWN";
        const policy = data.cited_policy_id || "None";
        const conf = data.confidence !== undefined ? `${(data.confidence * 100).toFixed(0)}%` : "N/A";
        const review = data.requires_human_review ? "Yes (Escalated)" : "No";
        const policies = data.retrieved_policies || [];

        out.innerHTML = `
          <div><span class="badge ${risk}">${risk} RISK</span></div>
          <div class="meta">
            <span><strong>Cited Policy:</strong> ${policy}</span>
            <span><strong>Confidence:</strong> ${conf}</span>
            <span><strong>Human Review:</strong> ${review}</span>
            <span><strong>Latency:</strong> ${data.latency_ms || elapsed} ms</span>
          </div>
          <p style="color: var(--text); font-size: 0.92rem;">${data.reasoning || ""}</p>
          ${policies.length ? `<strong>Retrieved pgvector Rules:</strong>` + policies.map(p => `
            <div class="policy-item">
              <strong>${p.policy_id}</strong> (similarity: ${Number(p.similarity || 0).toFixed(3)})<br/>
              <span style="color: var(--muted);">${p.rule_text}</span>
            </div>`).join("") : ""}
        `;
      } catch (err) {
        out.innerHTML = `<span class="badge HIGH">NETWORK ERROR</span><p>${err.message}</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Run RAG Triage Agent";
      }
    }
  </script>
</body>
</html>
